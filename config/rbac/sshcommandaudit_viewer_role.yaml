# permissions for end users to view sshcommandaudits.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ssh-monitor-controller
    app.kubernetes.io/managed-by: kustomize
  name: sshcommandaudit-viewer-role
rules:
- apiGroups:
  - ssh.controller.com
  resources:
  - sshcommandaudits
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ssh.controller.com
  resources:
  - sshcommandaudits/status
  verbs:
  - get
